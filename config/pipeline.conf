# ---------------------------------------------------------------------------
# Configuração do pipeline PROTAC PCSK9 — editada por você, lida pelo driver.
# Tudo que muda de máquina ou de projeto mora AQUI, não nos scripts.
# ---------------------------------------------------------------------------

# --- envs conda (nomes ou prefixos) ---
ENV_MDTOOLS="mdtools"
ENV_PFVS="pf_vs"
ENV_BOLTZ="gustavo_boltz-2"

# --- raízes ---
REPO="$HOME/Protac_env"
WORK="$HOME/PRosettaC_runs/vhl_crbn_pcsk9_protac"
STRUCTURES="$HOME/structures"

# --- Fase 1: warheads PCSK9 ---
WARHEADS_DIR="$HOME/PCSK9_warheads"
WARHEADS_NCONFS=50

# --- Fase 2: ancoragem na PCSK9 ---
PCSK9_PDB="$STRUCTURES/6U26.pdb"
PCSK9_CHAIN="B"
PCSK9_KEEP_CHAINS="A B"
PCSK9_REF_LIGAND="063"
PCSK9_BURIAL=20
DOCKING_DIR="$HOME/PCSK9_docking"
DOCK_SERIES="all"          # all | A | B
DOCK_ROUND1_CUTOFF=-7.0
DOCK_BATCH=40              # ligantes por lote na GPU

# --- Fase 3 (análise): critérios de viabilidade do warhead ---
# O corte de alinhamento foi escolhido sem base empírica: 0.3 deu 30/146.
# Afrouxar para 0.2 aumenta o conjunto; registre a escolha na tese.
ANALISE_SD_MAX=0.5
ANALISE_COS_MIN=0.3
N_WARHEADS_WP2=15          # quantos warheads seguem para montar PROTAC

# --- Fase 4: WP2 — recrutador E3, linkers ---
# Bibliotecas Chemspace (as únicas usadas; o Enamine ficou de fora por decisão
# sua — para incluir de volta, preencha LINKERS_EXTRA).
LINKERS_SDF="$WORK/chemspace_linkers/Chemspace_PROTACs_linkers_SDF.sdf"
ANCHORS_SDF="$WORK/chemspace_anchors/Chemspace_PROTACs_anchors_SDF.sdf"
LINKERS_EXTRA=""

# --- Fase 0: WP1 (já rodado — revalidação + escolha do recrutador) ---
WP1_SCREENING="$WORK/screening"
WP1_PREP="$WORK/prep"
WP1_E3_LIST="VHL CRBN"
WP1_BURIAL=20

# A Fase 0 escreve wp1_recruiter.json com recrutador, exit point e direção.
# As variáveis abaixo só são usadas se você quiser FORÇAR valores próprios;
# deixadas vazias, o driver lê do JSON.
E3_NAME=""
E3_RECRUITER_SDF=""
E3_EXIT_POINT=""
E3_EXIT_DIRECTION=""
E3_RECEPTOR_PDB=""

# --- Fase 5: WP2 geometria ---
LINKER_NCONFS=50
LINKER_NSPINS=12
LINKER_ATOM_MIN=5
LINKER_ATOM_MAX=40
LINKER_ROTB_MAX=15
N_LINKERS_WP3=10           # quantos linkers seguem para montar PROTAC

# --- Fase 6: PRosettaC ---
PROSETTAC_DIR="/mnt/hd2tb/Documentos/PRosettaC"
WARHEAD_ANCHOR_SERIAL=1    # confira num job isolado antes do lote
PROSETTAC_FULL="False"

# --- Fases 7-8: ranking e MD ---
MD_N_REPLICAS=3
MD_NS_PROD=200          # produção por réplica
MD_NS_NPT=5
MD_RANK=1               # 1 = melhor candidato; 2, 3... se a MD reprovar
MD_AUTO=1               # 1 = roda a MD automaticamente ao fim do pipeline

# Resíduos do cristal com cadeia lateral incompleta são reconstruídos antes da
# MD. Se algum ficar incompleto DENTRO do sítio, o preparo para — truncá-lo
# mudaria a interação que a MD existe para medir. Ponha 1 aqui para aceitar a
# truncagem conscientemente; ela será listada no log para constar na tese.
MD_TRUNCAR_PERTO=0

# --- saída ---
PIPELINE_OUT="$WORK/pipeline"
