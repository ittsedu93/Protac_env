# ---------------------------------------------------------------------------
# Track da VHL. Herda tudo da config principal e sobrescreve o que muda.
#
#   PIPELINE_CONF=config/pipeline_vhl.conf bash scripts/run_pipeline.sh --from 4
#
# Herdar em vez de copiar é deliberado: duas configs completas divergem, e foi
# divergência (a cadeia 'A' num receptor que só tem 'C', o `Full: False` herdado
# sem razão) que custou a semana do track da CRBN.
# ---------------------------------------------------------------------------
_AQUI_CONF="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
# shellcheck disable=SC1091
source "$_AQUI_CONF/pipeline.conf"

# --- o que muda: a E3 ------------------------------------------------------
# A lista com um nome só faz o wp1_select_recruiter escolher DENTRO da VHL, em
# vez de comparar VHL com CRBN. A comparação já foi feita e a CRBN ganhou por
# score de docking — e depois não produziu geometria ternária. Escolher a VHL
# aqui é uma decisão de projeto, e ela fica registrada neste arquivo.
WP1_E3_LIST="VHL"

# Zerados de propósito: o driver lê do wp1_recruiter.json que a fase 4 escreve.
# Preencher à mão aqui só se você quiser FORÇAR um recrutador específico.
E3_NAME=""
E3_RECRUITER_SDF=""
E3_EXIT_POINT=""
E3_EXIT_DIRECTION=""
E3_RECEPTOR_PDB=""

# --- saída separada: o track da CRBN continua íntegro ----------------------
# Marcadores `.done_*`, rankings e jobs do PRosettaC vão para cá. Nada do que a
# CRBN produziu é sobrescrito, e os dois tracks podem ser comparados na tese.
PIPELINE_OUT="$WORK/pipeline_vhl"

# --- fase 4b: o vão exigido, medido antes de escolher linker ---------------
# 20 transformadas é o piso para o Rosetta ter o que refinar: a curva da CRBN
# deu 1 transformada em 14 Å e 40 em 18 Å, e o candidato que fechava a ponte no
# limite reprovou 97% dos modelos por energia.
SPAN_TRANSFORMADAS_UTEIS=20
# Razão mediana/teto do alcance, medida em SC0013__WH022 (11,6 / 18,03). Ela
# converte "vão exigido" em "teto de alcance exigido": a ponte precisa fechar
# perto do meio da distribuição conformacional, não no extremo.
SPAN_RAZAO_MEDIANA_TETO=0.64
# Distâncias da varredura. O 100 é CONTROLE, não medida: sem restrição efetiva
# o docking tem de devolver milhares, e zero ali invalida a curva inteira.
# Começa em 6 e não em 10: a varredura da VHL mostrou 204 transformadas já no
# ponto mais baixo (10 Å), ou seja, o piso estava fora da faixa medida. Piso
# menor admite linker mais curto, e linker mais curto é massa molecular que não
# se gasta — com recrutador de VHL, que já pesa mais, isso importa.
SPAN_DISTANCIAS="6 8 10 12 14 16 18 20 22 25 28 32 100"

# --- fase 5: linkers, agora com piso vindo da medição ---------------------
# O LINKER_ATOM_MIN é sobrescrito pela fase 4b com o valor medido. O que está
# aqui é só o piso de partida; a fase 4b escreve o valor real em
# $PIPELINE_OUT/span_requirement.json e o driver o aplica.
LINKER_ATOM_MIN=5
LINKER_ATOM_MAX=60          # a CRBN topou em 15 ligações e isso foi o gargalo
N_LINKERS_WP3=15

# --- fase 6: PRosettaC ----------------------------------------------------
# True desde o começo: `Full: False` é metade da amostragem global e um quinto
# do refinamento, e concluir ausência de geometria com isso é concluir errado.
PROSETTAC_FULL="True"

# --- ordem entre a MD (ii) e o ternário -----------------------------------
# O QUE A METODOLOGIA DIZ, textualmente (WP3, seção 3 do notebook):
#
#   "Simulations will be run at three levels of increasing complexity:
#    (i) E3 ligase-recruiter-linker; (ii) E3 ligase-recruiter-linker-warhead;
#    and (iii) E3 ligase-recruiter-linker-warhead-PCSK9, the complete ternary
#    complex"
#
# São TRÊS níveis, e o (ii) tem função declarada no mesmo parágrafo:
#
#   "Stage (ii) will additionally screen for spurious, PCSK9-independent
#    direct interaction between the warhead and the E3 ligase itself, which
#    may indicate an unproductive linker orientation and warrant exclusion of
#    the candidate."
#
# Isso é registrado aqui porque a decisão abaixo é um DESVIO consciente da
# metodologia, e um desvio que não está escrito na config é um desvio que não
# chega à tese.
#
# A DECISÃO: nesta passada da VHL, só o nível (iii) roda. MD_AUTO=0 pula a
# fase 8, e a fase 9 (PRosettaC + portão de concordância) vem antes.
#
# O motivo é aritmético: o ternário custa 3–6 h de PRosettaC e foi ele que
# matou o track da CRBN; a MD do nível (ii) custou 46 h medidas. Gastar 46 h
# antes de saber se existe pose ternária é a troca que este projeto já fez uma
# vez e pagou.
#
# O QUE SE PERDE ao pular o (ii): a triagem de interação espúria
# warhead<->E3 na AUSÊNCIA da PCSK9. O nível (iii) NÃO substitui isso — com a
# PCSK9 presente e a warhead ancorada nela, uma afinidade espúria da warhead
# pela E3 fica mascarada. É uma pergunta que só se faz sem o alvo.
#
# Como recuperar sem gastar 46 h à toa: rodar o (ii) DEPOIS, só para o
# candidato que o (iii) aprovar, como confirmação e não como portão —
# `--from 8` com MD_AUTO=1. Assim os dois níveis aparecem na tese, e a GPU foi
# gasta primeiro no que decide.
MD_AUTO=0

# --- fase 9: portão de concordância do ternário ---------------------------
# Quantos modelos têm de concordar (RMSD do alvo, superpondo pela E3) para a
# pose ir à MD nível (iii). Com a CRBN o maior grupo foi de 2 em 30 — e dois
# modelos não são uma interface.
TERNARIO_CORTE_A=5.0
TERNARIO_GRUPO_MIN=5
# Quanto esperar pelo Results — e a resposta deixou de ser um prazo.
#
# A medição que mudou isto: em 01/10, a etapa de conformações do linker andava
# a 12 jobs/h com 2532 jobs na fila, o que dá ~8,6 dias (fim por volta de
# 10/10). Com o limite anterior de 168 h (7 dias) o driver declararia falha em
# 08/10 — dois dias ANTES do fim — jogando fora sete dias de máquina com uma
# mensagem sobre "ausência de geometria ternária" que seria simplesmente falsa.
#
# Um prazo não sabe a diferença entre devagar e parado, e essa é exatamente a
# pergunta. Agora quem decide é FALTA DE PROGRESSO: enquanto a fila baixa,
# arquivos nascem ou o log cresce, espera-se, por mais dias que leve.
TERNARIO_SEM_PROGRESSO_H=12
# Teto absoluto, só como rede para o driver não ficar vivo para sempre numa
# máquina esquecida. 336 h = 14 dias, com folga sobre os 8,6 medidos.
TERNARIO_LIMITE_H=336

# --- fase 10: MD do nível (iii), o ternário completo ----------------------
# NÃO automática, de propósito. A workstation é compartilhada e esta fase são
# 3 x 200 ns com a GPU dedicada por dias; o driver imprime os três comandos e
# para, para que o horário seja combinado com quem mais usa a máquina em vez
# de decidido por um script. Ponha 1 quando a janela estiver combinada.
MD_TERNARIO_AUTO=0

# Teto do tamanho do sistema solvatado. Um ternário VHL+PCSK9 real dá ~120 mil
# átomos e pede ~0,8 GB, bem abaixo disto — o limite não existe para apertar o
# caso normal, existe para recusar o caso patológico. Uma aresta de caixa muito
# maior que o complexo denuncia cadeia estendida ou mais de um complexo no
# arquivo, e descobrir isso ANTES de solvatar custa segundos em vez de horas.
MD_RAM_LIMITE_GB=8

# Réplicas e tempos do nível (iii) são os MESMOS do (ii), porque a metodologia
# do WP3 é a mesma: 3 x 200 ns a 310 K/1 atm, precedidos de 5 ns de NPT. Ficam
# aqui explícitos para poderem ser reduzidos numa passada de teste sem editar
# o md_run.sh — mas reduzir muda o que a tese pode afirmar, e isso tem de ser
# declarado.
MD_N_REPLICAS=3
MD_NS_PROD=200
MD_NS_NPT=5

# Este e o track em uso. A CRBN ficou como comparacao na tese, nao como
# alvo de trabalho.
TRACK="VHL"
